name: CBORGUsageMonitor
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
targets:
  CBORGUsageMonitor:
    type: application
    platform: macOS
    sources:
      - path: CBORGUsageMonitor
      - path: Shared
    dependencies:
      - target: CBORGUsageMonitorWidgetExtension
      - sdk: Security.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.CBORGUsageMonitor
        PRODUCT_NAME: CBORGUsageMonitor
        INFOPLIST_FILE: CBORGUsageMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: CBORGUsageMonitor/CBORGUsageMonitor.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
  CBORGUsageMonitorWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CBORGUsageMonitorWidgetExtension
      - path: Shared
        excludes:
          - CBORGKeychain.swift
          - CBORGUsageClient.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.CBORGUsageMonitor.CBORGUsageMonitorWidgetExtension
        PRODUCT_NAME: CBORGUsageMonitorWidgetExtension
        INFOPLIST_FILE: CBORGUsageMonitorWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CBORGUsageMonitorWidgetExtension/CBORGUsageMonitorWidgetExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
schemes:
  CBORGUsageMonitor:
    build:
      targets:
        CBORGUsageMonitor: all
        CBORGUsageMonitorWidgetExtension: all
    run:
      config: Debug
